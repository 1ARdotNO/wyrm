name: Bug report
description: Something in wyrm behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, plus a minimal OTM model if relevant.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wyrm version / commit
    validations:
      required: true
