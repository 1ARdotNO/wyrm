# Builds the TypeScript/JS editor extensions so dependency bumps (which Renovate
# automerges) can't silently break them — the Rust CI doesn't cover these.
name: Editors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editors-build:
    name: editors-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"

      - name: VS Code extension — typecheck & build
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Obsidian plugin — build (wasm + bundle)
        working-directory: editors/obsidian
        run: |
          npm ci
          npm run build
