# cargo (fmt + clippy) already gates Rust in CI, so MegaLinter covers everything
# else: YAML, Markdown, JSON, GitHub Actions, and secret scanning.
APPLY_FIXES: none
DISABLE:
  - RUST
DISABLE_LINTERS:
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
  - SPELL_CSPELL
  # zizmor needs GitHub API access to resolve `uses:` refs and 401s in CI; its job
  # (GHA hardening) is tracked separately via SHA-pinning. actionlint still runs.
  - ACTION_ZIZMOR
  - REPOSITORY_TRIVY # Trivy runs as its own workflow already
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
