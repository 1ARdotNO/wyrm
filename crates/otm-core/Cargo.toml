[package]
name = "otm-core"
description = "Open Threat Model (OTM) parsing, validation, STRIDE rule engine, and diagram generation — the shared engine behind wyrm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The Terraform importer pulls an HCL parser; keep it out of the WASM build (which
# never generates) by gating it. wyrm-cli enables it.
terraform = ["dep:hcl-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
hcl-rs = { version = "0.19.8", optional = true }
