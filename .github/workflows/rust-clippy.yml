# Reports clippy findings to the Security tab (code scanning) as SARIF. This is
# informational and non-blocking — the hard `clippy -D warnings` gate lives in
# ci.yml. Uses dtolnay/rust-toolchain (the actions-rs actions are archived).
name: rust-clippy analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "19 18 * * 0"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: clippy-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: clippy-sarif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install clippy-sarif
        run: cargo install clippy-sarif sarif-fmt --locked
      - name: Run clippy (SARIF)
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
