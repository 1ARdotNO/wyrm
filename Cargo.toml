[workspace]
resolver = "3"
members = ["crates/otm-core", "crates/wyrm-cli", "crates/wyrm-lsp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/1ARdotNO/wyrm"
authors = ["1ARdotNO"]

[workspace.dependencies]
otm-core = { path = "crates/otm-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Maintained fork of the archived serde_yaml — keeps the cargo-deny advisory gate green.
serde_yaml_ng = "0.10"
thiserror = "2.0.20"
clap = { version = "4.6.7", features = ["derive"] }
lsp-server = "0.10.0"
lsp-types = "0.97"

[profile.release]
strip = true
lto = "thin"
