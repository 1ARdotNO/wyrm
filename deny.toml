# cargo-deny configuration — the supply-chain gate behind aggressive automerge.
# A bump can only merge itself if it stays clean here.

[advisories]
version = 2
# Deny any crate with a known advisory or that has been yanked.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only; anything copyleft or unknown blocks the merge.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
