[package]
name = "wyrm-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/1ARdotNO/wyrm"
authors = ["1ARdotNO"]
description = "Native GUI editor for wyrm OTM threat models"

[dependencies]
otm-core = { path = "../otm-core" }
# Held at 0.32 — egui 0.36 is a major API break (App::ui not update, panels moved,
# Context::style removed) and needs Rust 1.95. Renovate is capped <0.33 until the
# 0.36 migration (see task). 0.32.x builds on our toolchain.
eframe = "0.32"
egui = "0.32"
