# Builds the TypeScript/JS editor extensions so dependency bumps (which Renovate
# automerges) can't silently break them — the Rust CI doesn't cover these.
name: Editors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editors-build:
    name: editors-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"

      - name: VS Code extension — typecheck & build
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Obsidian plugin — build (wasm + bundle)
        working-directory: editors/obsidian
        run: |
          npm ci
          npm run build
