[workspace]
resolver = "3"
members = ["crates/otm-core", "crates/wyrm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/1ARdotNO/wyrm"
authors = ["1ARdotNO"]

[workspace.dependencies]
otm-core = { path = "crates/otm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived serde_yaml — keeps the cargo-deny advisory gate green.
serde_yaml_ng = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
