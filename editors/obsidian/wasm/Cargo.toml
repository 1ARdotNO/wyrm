[package]
name = "otm-wasm"
description = "WebAssembly bindings for otm-core — powers the wyrm Obsidian plugin."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone crate (own workspace): built for wasm via wasm-pack, not part of the
# host workspace. Shares the exact same engine as the CLI and LSP.
[lib]
crate-type = ["cdylib"]

[dependencies]
otm-core = { path = "../../../crates/otm-core" }
wasm-bindgen = "0.2"
serde_json = "1"

[workspace]
